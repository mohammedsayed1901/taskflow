name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:8.3.8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(0)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify MongoDB availability
        run: |
          set -euo pipefail

          echo "MongoDB container ID: ${{ job.services.mongodb.id }}"
          docker ps --all --no-trunc
          docker port "${{ job.services.mongodb.id }}"

          for attempt in {1..30}; do
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/27017" 2>/dev/null; then
              echo "MongoDB is reachable at 127.0.0.1:27017"
              exit 0
            fi

            echo "Waiting for MongoDB: attempt ${attempt}/30"
            sleep 2
          done

          echo "MongoDB did not become reachable"
          docker logs "${{ job.services.mongodb.id }}"
          exit 1

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  container:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag taskflow:ci .
