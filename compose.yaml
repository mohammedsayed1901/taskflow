name: taskflow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - '${APP_PORT:-5000}:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/taskflow
      CLIENT_ORIGIN: http://localhost:${APP_PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the root .env file}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      TRUST_PROXY: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
    stop_grace_period: 15s

  mongodb:
    image: mongo:8.3.8
    restart: unless-stopped
    expose:
      - '27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb_data:
